<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maria Showalter — holographic header</title>
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('/Fraunces-SemiBold.ttf') format('truetype');
        font-weight: 600; font-style: normal; font-display: block;
      }
      :root { --ink: #0a0a0a; --blue: #0044ff; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #ffffff;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
      }
      #hero-host { position: fixed; inset: 0; }
      #hero-host canvas { display: block; touch-action: none; }

      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      .overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
      .kicker {
        position: absolute; top: 26px; left: 5vw;
        font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
        color: var(--blue);
      }
      .sub {
        position: absolute; bottom: 30px; left: 5vw;
        font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
        color: var(--ink); opacity: .5; max-width: 44vw; line-height: 1.7;
      }

      /* ── always-visible control cluster (bottom-right) ── */
      .hero-controls {
        position: fixed; bottom: 28px; right: 5vw; z-index: 11;
        display: flex; gap: 8px; align-items: center;
      }
      .pill {
        font-family: inherit; font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
        color: var(--blue); background: rgba(255,255,255,.72); backdrop-filter: blur(8px);
        border: 1px solid rgba(0,68,255,.4); border-radius: 100px; padding: 9px 14px; cursor: pointer;
        transition: background .2s, color .2s, opacity .25s;
      }
      .pill:hover { background: var(--blue); color: #fff; }
      .pill.accent { border-color: var(--blue); }
      .pill.hidden { opacity: 0; pointer-events: none; }

      /* ── palette panel (hidden until invited) ── */
      .panel {
        position: fixed; top: 50%; left: 5vw; z-index: 10;
        width: 196px; padding: 14px; border-radius: 14px;
        background: rgba(255,255,255,.78); backdrop-filter: blur(10px);
        border: 1px solid rgba(0,0,0,.1);
        display: flex; flex-direction: column; gap: 8px;
        transform: translate(-130%, -50%); opacity: 0; pointer-events: none;
        transition: transform .4s cubic-bezier(.16,1,.3,1), opacity .3s ease;
      }
      .panel.open { transform: translate(0, -50%); opacity: 1; pointer-events: auto; }
      .panel-head { display: flex; align-items: center; justify-content: space-between; }
      .panel-title { font-size: 8px; letter-spacing: .2em; text-transform: uppercase; color: #888; margin: 2px 0; }
      .panel-close {
        font-family: inherit; font-size: 10px; color: #888; background: none; border: none;
        cursor: pointer; padding: 2px 4px; line-height: 1;
      }
      .panel-close:hover { color: var(--blue); }
      #pal-list { display: flex; flex-direction: column; gap: 5px; }
      .pal {
        display: flex; align-items: center; gap: 9px; cursor: pointer;
        border: 1px solid rgba(0,0,0,.1); background: rgba(255,255,255,.5);
        border-radius: 9px; padding: 6px 8px; text-align: left; width: 100%;
        transition: border-color .2s, transform .12s;
      }
      .pal:hover { transform: translateX(2px); }
      .pal.active { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
      .pal-chip { width: 24px; height: 24px; border-radius: 6px; flex: 0 0 auto; border: 1px solid rgba(0,0,0,.08); }
      .pal-text { display: flex; flex-direction: column; line-height: 1.25; }
      .pal-text b { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 13px; color: var(--ink); }
      .pal-text small { font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: #999; }

      #knob-list { display: flex; flex-direction: column; gap: 8px; }
      .knob { display: flex; flex-direction: column; gap: 4px; }
      .knob label { font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: #888; }
      .knob input {
        -webkit-appearance: none; appearance: none; width: 100%; height: 2px;
        background: rgba(0,0,0,.15); border-radius: 2px; outline: none;
      }
      .knob input::-webkit-slider-thumb {
        -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
        background: var(--blue); cursor: pointer;
      }
      .reset {
        margin-top: 4px; font-family: inherit; font-size: 9px; letter-spacing: .14em;
        text-transform: uppercase; color: var(--blue);
        border: 1px solid var(--blue); background: none; border-radius: 100px;
        padding: 7px 12px; cursor: pointer; transition: background .2s, color .2s;
      }
      .reset:hover { background: var(--blue); color: #fff; }
    </style>
  </head>
  <body>
    <h1 class="sr-only">Maria Showalter — software &amp; design engineer</h1>
    <div id="hero-host" aria-hidden="true"></div>

    <div class="overlay">
      <div class="kicker">Maria Showalter · CS + design engineer</div>
      <div class="sub">My portrait on a holographic fabric — grab it to ripple it.</div>
    </div>

    <input type="file" id="photo-input" accept="image/*" hidden />
    <div class="hero-controls">
      <button class="pill" id="change-photo">change photo</button>
      <button class="pill" id="reset-main">↻ reset</button>
      <button class="pill accent" id="color-toggle">✦ prefer it in colour?</button>
    </div>

    <div class="panel" id="panel">
      <div class="panel-head">
        <span class="panel-title">Palette · themes the page</span>
        <button class="panel-close" id="panel-close">×</button>
      </div>
      <div id="pal-list"></div>
      <div class="panel-title">Play with</div>
      <div id="knob-list"></div>
    </div>

    <script type="module" src="/src/hero.ts"></script>
  </body>
</html>
