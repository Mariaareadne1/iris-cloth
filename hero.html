<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maria Showalter — holographic header</title>
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('/Fraunces-SemiBold.ttf') format('truetype');
        font-weight: 600; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: 'Fraunces';
        src: url('/Fraunces-Italic.ttf') format('truetype');
        font-weight: 400; font-style: italic; font-display: block;
      }
      :root { --ink: #0a0a0a; --blue: #0044ff; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #ffffff;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        transition: background .35s ease;
      }
      #hero-host { position: fixed; inset: 0; }
      #hero-host canvas { display: block; touch-action: none; }

      .overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
      .kicker {
        position: absolute; top: 26px; left: 5vw;
        font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
        color: var(--blue);
      }
      .sub {
        position: absolute; bottom: 30px; left: 5vw;
        font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
        color: var(--ink); opacity: .5; max-width: 40vw; line-height: 1.7;
        transition: color .35s ease;
      }

      /* ── left palette panel ── */
      .panel {
        position: fixed; top: 50%; left: 5vw; transform: translateY(-50%); z-index: 10;
        width: 190px; padding: 14px; border-radius: 14px;
        background: rgba(255,255,255,.72); backdrop-filter: blur(10px);
        border: 1px solid rgba(0,0,0,.1);
        display: flex; flex-direction: column; gap: 8px;
      }
      .panel.dark { background: rgba(10,10,10,.5); border-color: rgba(255,255,255,.14); }
      .panel-title {
        font-size: 8px; letter-spacing: .2em; text-transform: uppercase;
        color: #888; margin: 2px 0 2px;
      }
      #pal-list { display: flex; flex-direction: column; gap: 6px; }
      .pal {
        display: flex; align-items: center; gap: 10px; cursor: pointer;
        border: 1px solid rgba(0,0,0,.1); background: rgba(255,255,255,.4);
        border-radius: 10px; padding: 7px 9px; text-align: left; width: 100%;
        transition: border-color .2s, transform .12s;
      }
      .panel.dark .pal { border-color: rgba(255,255,255,.14); background: rgba(255,255,255,.05); }
      .pal:hover { transform: translateX(2px); }
      .pal.active { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
      .pal-chip { width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto; }
      .pal-text { display: flex; flex-direction: column; line-height: 1.25; }
      .pal-text b {
        font-family: 'Fraunces', Georgia, serif; font-weight: 600;
        font-size: 13px; color: var(--ink);
      }
      .pal-text small {
        font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: #999;
      }
      .shimmer-row { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
      #shimmer { -webkit-appearance: none; appearance: none; width: 100%; height: 2px;
        background: rgba(0,0,0,.15); border-radius: 2px; outline: none; }
      .panel.dark #shimmer { background: rgba(255,255,255,.2); }
      #shimmer::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px;
        border-radius: 50%; background: var(--blue); cursor: pointer; }

      /* ── bottom-right background picker ── */
      .controls {
        position: fixed; bottom: 24px; right: 5vw; z-index: 10;
        display: flex; align-items: center; gap: 12px;
        background: rgba(255,255,255,.72); backdrop-filter: blur(8px);
        border: 1px solid rgba(0,0,0,.1); border-radius: 100px; padding: 8px 12px;
      }
      .controls.dark { background: rgba(10,10,10,.5); border-color: rgba(255,255,255,.15); }
      .ctl-label { font-size: 8px; letter-spacing: .18em; text-transform: uppercase; color: #888; margin-right: 2px; }
      .sw { width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
        border: 1px solid rgba(0,0,0,.25); background: var(--c); padding: 0;
        transition: transform .15s, box-shadow .15s; }
      .sw:hover { transform: scale(1.15); }
      .sw.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--blue); }
      .controls.dark .sw.active { box-shadow: 0 0 0 2px #0a0a0a, 0 0 0 4px var(--blue); }
      .reset { font-family: inherit; font-size: 9px; letter-spacing: .14em;
        text-transform: uppercase; color: var(--blue);
        border: 1px solid var(--blue); background: none; border-radius: 100px;
        padding: 6px 12px; cursor: pointer; margin-left: 4px;
        transition: background .2s, color .2s; }
      .reset:hover { background: var(--blue); color: #fff; }
    </style>
  </head>
  <body>
    <div id="hero-host"></div>

    <div class="overlay">
      <div class="kicker">Maria Showalter · CS + design engineer</div>
      <div class="sub">A holographic fabric printed with my name. Pick a palette — it recolors
        the cloth and the page. Grab the cloth to ripple it.</div>
    </div>

    <div class="panel dark-aware" id="panel">
      <div class="panel-title">Palette</div>
      <div id="pal-list"></div>
      <div class="shimmer-row">
        <div class="panel-title">Shimmer</div>
        <input id="shimmer" type="range" min="0" max="3" step="0.05" value="1.7" />
      </div>
    </div>

    <div class="controls dark-aware" id="controls">
      <span class="ctl-label">bg</span>
      <button class="sw" data-bg="#ffffff" data-noise="0" data-exposure="1.15" data-paper style="--c:#ffffff" title="paper white (clean)"></button>
      <button class="sw" data-bg="#f6f7fb" style="--c:#f6f7fb" title="soft white"></button>
      <button class="sw" data-bg="#f8f6f3" style="--c:#f8f6f3" title="off-white"></button>
      <button class="sw" data-bg="#eef0ff" style="--c:#eef0ff" title="ice"></button>
      <button class="sw" data-bg="#0a0a0a" style="--c:#0a0a0a" title="ink black"></button>
      <button class="sw" data-bg="#071033" style="--c:#071033" title="deep navy"></button>
      <button class="sw" data-bg="#0044ff" style="--c:#0044ff" title="electric blue"></button>
      <button class="reset" id="reset">reset cloth</button>
    </div>

    <script type="module" src="/src/hero.ts"></script>
  </body>
</html>
