<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maria Showalter — holographic header</title>
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('/Fraunces-SemiBold.ttf') format('truetype');
        font-weight: 600;
        font-display: block;
      }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #ffffff;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
      }
      #hero-host { position: fixed; inset: 0; }
      #hero-host canvas { display: block; touch-action: none; }
      .overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
      .kicker {
        position: absolute; top: 26px; left: 5vw;
        font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
        color: #0044ff;
      }
      .sub {
        position: absolute; bottom: 30px; left: 5vw;
        font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
        color: #0a0a0a; opacity: .5; max-width: 60vw; line-height: 1.7;
      }
      .grab-hint {
        position: absolute; bottom: 30px; right: 5vw;
        font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
        color: #888; text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="hero-host"></div>
    <div class="overlay">
      <div class="kicker">Maria Showalter · CS + design engineer</div>
      <div class="sub">Software &amp; design engineer — the header is a real holographic
        fabric with my name printed on it. Grab it.</div>
      <div class="grab-hint">drag to grab the cloth<br>drag empty space to orbit</div>
    </div>
    <script type="module" src="/src/hero.ts"></script>
  </body>
</html>
